<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nidan Kendra | Digital Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div id="app" class="max-w-md mx-auto relative pb-20">
        
        <!-- HEADER -->
        <header class="bg-[#0f172a] p-8 rounded-b-[3rem] shadow-2xl border-b-4 border-yellow-400">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-extrabold text-yellow-400 tracking-tighter italic">NIDAN KENDRA</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Tamkuhi Raj • Live Portal</p>
                </div>
                <div class="h-10 w-10 bg-yellow-400 rounded-2xl flex items-center justify-center shadow-lg">
                    <span class="text-slate-900 font-black">GM</span>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="p-6">
            
            <!-- VIEW: OWNER DASHBOARD -->
            <div id="owner-view" class="space-y-6">
                <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl text-center relative overflow-hidden">
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-green-500/10 rounded-full"></div>
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-2">Net Profit Today</p>
                    <h2 class="text-5xl font-black text-green-400 tracking-tighter">₹<span id="display-profit">923</span></h2>
                    <div class="mt-6 pt-6 border-t border-slate-800 flex justify-around">
                        <div><p class="text-[9px] text-slate-500 font-bold">CASH</p><p class="font-black text-yellow-400">₹1,650</p></div>
                        <div class="w-[1px] bg-slate-800"></div>
                        <div><p class="text-[9px] text-slate-500 font-bold">DUES</p><p class="font-black text-red-400">₹290</p></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Pathkind Wallet</p>
                        <p class="text-lg font-black text-slate-700">₹1,033</p>
                    </div>
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Thyrocare</p>
                        <p class="text-lg font-black text-slate-700">₹5,400</p>
                    </div>
                </div>

                <button onclick="switchView('staff')" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase tracking-widest text-xs shadow-xl active:scale-95 transition-all">
                    ➕ New Patient Entry
                </button>
            </div>

            <!-- VIEW: STAFF ENTRY (HIDDEN BY DEFAULT) -->
            <div id="staff-view" class="hidden space-y-4">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100">
                    <h3 class="text-xl font-black text-slate-800 mb-6">Register Patient</h3>
                    <div class="space-y-4">
                        <input id="p-name" type="text" placeholder="Patient Name" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-yellow-400 outline-none font-bold transition-all">
                        <select id="p-test" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-yellow-400 outline-none font-bold">
                            <option value="210">CBC (₹210)</option>
                            <option value="350">LIPID PROFILE (₹350)</option>
                            <option value="1000">KFT (₹1000)</option>
                            <option value="549">HEALTHKIND NOVA (₹549)</option>
                        </select>
                        <input id="p-received" type="number" placeholder="Amount Received" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-yellow-400 outline-none font-bold">
                        
                        <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                            <p class="text-[10px] font-black text-blue-600 uppercase">Auto-Calculation (Mishra Rule)</p>
                            <p class="text-xs font-bold text-blue-800">TDS: 10% of Profit will be deducted.</p>
                        </div>

                        <button onclick="saveTransaction()" class="w-full bg-yellow-400 text-slate-900 py-5 rounded-2xl font-black uppercase tracking-widest text-xs shadow-lg active:scale-95 transition-all">
                            Save & Sync to Cloud
                        </button>
                    </div>
                </div>
                <button onclick="switchView('owner')" class="w-full text-slate-400 font-bold uppercase text-[10px] tracking-widest py-4">← Back to Dashboard</button>
            </div>

        </main>
    </div>

    <script>
        function switchView(view) {
            const owner = document.getElementById('owner-view');
            const staff = document.getElementById('staff-view');
            if(view === 'staff') {
                owner.classList.add('hidden');
                staff.classList.remove('hidden');
            } else {
                owner.classList.remove('hidden');
                staff.classList.add('hidden');
            }
        }

        function saveTransaction() {
            const name = document.getElementById('p-name').value;
            const mrp = document.getElementById('p-test').value;
            if(!name) return alert("Please enter name");

            // BUSINESS LOGIC: 10% TDS ON PROFIT
            const cost = mrp * 0.40; // Assumed Lab share
            const profit = mrp - cost;
            const tds = profit * 0.10;
            const finalProfit = profit - tds;

            alert(`✅ Saved Successfully!\nPatient: ${name}\nNet Profit added: ₹${finalProfit.toFixed(2)}`);
            switchView('owner');
            document.getElementById('display-profit').innerText = (923.50 + finalProfit).toFixed(2);
        }
    </script>
</body>
</html>
