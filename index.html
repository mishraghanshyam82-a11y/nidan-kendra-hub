<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nidan Kendra | Pro Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { border-bottom: 4px solid #fbce1e; color: #fbce1e; }
        input, select { font-size: 16px !important; } /* Prevents iOS zoom zoom */
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 overflow-x-hidden">

    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col">
        
        <!-- TOP BRAND BAR -->
        <header class="bg-[#0f172a] pt-10 pb-6 px-6 rounded-b-[2.5rem] shadow-2xl sticky top-0 z-50 border-b-4 border-yellow-400">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black text-yellow-400 tracking-tighter italic">NIDAN KENDRA</h1>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Live Cloud Engine</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="location.reload()" class="p-2 bg-slate-800 rounded-xl text-slate-400"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg></button>
                </div>
            </div>
        </header>

        <!-- NAVIGATION TABS -->
        <nav class="flex bg-[#0f172a] px-6 mt-[-1px]">
            <button id="tab-owner" onclick="switchView('owner')" class="flex-1 py-4 text-xs font-black uppercase tracking-widest active-tab transition-all">Dashboard</button>
            <button id="tab-staff" onclick="switchView('staff')" class="flex-1 py-4 text-xs font-black uppercase tracking-widest text-slate-500 transition-all">New Entry</button>
        </nav>

        <main class="p-6 flex-grow">
            
            <!-- VIEW: OWNER DASHBOARD -->
            <div id="owner-view" class="space-y-6">
                <!-- MAIN KPI -->
                <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl text-center relative overflow-hidden group">
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-green-500/10 rounded-full group-hover:scale-150 transition-all duration-700"></div>
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-2">Net Profit Today</p>
                    <h2 id="display-total-profit" class="text-5xl font-black text-green-400 tracking-tighter italic">₹0.00</h2>
                    <div class="mt-6 pt-6 border-t border-slate-800 flex justify-around">
                        <div>
                            <p class="text-[9px] text-slate-500 font-bold uppercase">Today's Sales</p>
                            <p id="display-total-sales" class="font-black text-white text-lg">₹0</p>
                        </div>
                        <div class="w-[1px] bg-slate-800"></div>
                        <div>
                            <p class="text-[9px] text-slate-500 font-bold uppercase text-red-400">Total Dues</p>
                            <p id="display-total-dues" class="font-black text-red-400 text-lg">₹0</p>
                        </div>
                    </div>
                </div>

                <!-- LAB WALLETS -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col justify-between">
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Pathkind Wallet</p>
                        <h3 class="text-xl font-black text-slate-700">₹1,033</h3>
                        <div class="mt-2 w-full bg-slate-100 h-1 rounded-full overflow-hidden">
                            <div class="bg-red-500 w-1/4 h-full"></div>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Thyrocare</p>
                        <h3 class="text-xl font-black text-slate-700">₹5,400</h3>
                        <div class="mt-2 w-full bg-slate-100 h-1 rounded-full overflow-hidden">
                            <div class="bg-green-500 w-3/4 h-full"></div>
                        </div>
                    </div>
                </div>

                <!-- RECENT TRANSACTIONS LIST -->
                <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-6">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Recent Patients</h3>
                    <div id="recent-list" class="space-y-4 max-h-60 overflow-y-auto no-scrollbar">
                        <p class="text-center text-xs text-slate-400 py-4 italic">No data yet. Syncing...</p>
                    </div>
                </div>
            </div>

            <!-- VIEW: STAFF ENTRY -->
            <div id="staff-view" class="hidden space-y-4 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-200">
                    <h3 class="text-xl font-black text-slate-800 mb-6">Patient Registration</h3>
                    
                    <div class="space-y-5">
                        <!-- Patient Info -->
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Full Name</label>
                            <input id="p-name" type="text" placeholder="Ghanshyam Mishra" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-yellow-400 focus:bg-white outline-none font-bold transition-all">
                        </div>

                        <!-- Searchable Test Dropdown -->
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Select Test (Searchable)</label>
                            <input list="test-list" id="p-test-search" oninput="updateCalculator()" placeholder="Type Test Name (e.g. CBC)" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-yellow-400 focus:bg-white outline-none font-bold transition-all">
                            <datalist id="test-list"></datalist>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Received Cash</label>
                                <input id="p-received" type="number" oninput="updateCalculator()" placeholder="0.00" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-green-400 outline-none font-bold">
                            </div>
                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Discount %</label>
                                <select id="p-discount" onchange="updateCalculator()" class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent outline-none font-bold">
                                    <option value="0">0%</option>
                                    <option value="10">10%</option>
                                    <option value="20">20%</option>
                                    <option value="30">30%</option>
                                </select>
                            </div>
                        </div>

                        <!-- LIVE MISHRA CALCULATOR PREVIEW -->
                        <div id="calc-preview" class="bg-blue-900 p-5 rounded-3xl text-white shadow-inner hidden">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] font-bold text-blue-300">EST. NET PROFIT</span>
                                <span id="calc-profit" class="text-xl font-black text-green-400">₹0.00</span>
                            </div>
                            <div class="flex justify-between items-center border-t border-blue-800 pt-2">
                                <span class="text-[10px] font-bold text-blue-300">TDS (10% OF PROFIT)</span>
                                <span id="calc-tds" class="text-xs font-bold text-yellow-400">₹0.00</span>
                            </div>
                        </div>

                        <button onclick="saveTransaction()" id="save-btn" class="w-full bg-[#0f172a] text-yellow-400 py-5 rounded-3xl font-black uppercase tracking-widest text-xs shadow-xl active:scale-95 transition-all mt-4 disabled:opacity-50">
                            Save to Nidan Cloud
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // --- CTO CONFIGURATION ---
        const SB_URL = "https://ijndfxvzltvpklvtiytw.supabase.co"; 
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqbmRmeHZ6bHR2cGtsdnRpeXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5OTUzMDksImV4cCI6MjA5NjU3MTMwOX0.rP6TSytlYGJ-jYQUDMyzolBGiBHN3GYzfcn2Nn42-hY

"; 
        
        const supabase = supabase.createClient(SB_URL, SB_KEY);
        let testsData = [];

        async function init() {
            try {
                // 1. Load Lab Catalog for Searchable List
                const { data: tests } = await supabase.from('test_catalog').select('*').order('name', { ascending: true });
                if (tests) {
                    testsData = tests;
                    const datalist = document.getElementById('test-list');
                    datalist.innerHTML = tests.map(t => `<option value="${t.name}">MRP: ₹${t.mrp}</option>`).join('');
                }

                // 2. Load Dashboard Totals
                refreshDashboard();
            } catch (err) {
                console.error("Initialization Failed", err);
            }
        }

        async function refreshDashboard() {
            const { data: trans } = await supabase.from('transactions').select('*').order('created_at', { ascending: false });
            if (trans) {
                const totalProfit = trans.reduce((acc, curr) => acc + Number(curr.net_profit || 0), 0);
                const totalSales = trans.reduce((acc, curr) => acc + Number(curr.mrp_charged || 0), 0);
                const totalDues = trans.reduce((acc, curr) => acc + Number(curr.due_amount || 0), 0);

                document.getElementById('display-total-profit').innerText = "₹" + totalProfit.toLocaleString('en-IN', { minimumFractionDigits: 2 });
                document.getElementById('display-total-sales').innerText = "₹" + totalSales.toLocaleString('en-IN');
                document.getElementById('display-total-dues').innerText = "₹" + totalDues.toLocaleString('en-IN');

                const list = document.getElementById('recent-list');
                list.innerHTML = trans.slice(0, 5).map(t => `
                    <div class="flex justify-between items-center border-b border-slate-50 pb-3">
                        <div>
                            <p class="text-sm font-bold text-slate-800">${t.patient_name || 'Walking Patient'}</p>
                            <p class="text-[9px] text-slate-400 uppercase font-black tracking-tighter">${new Date(t.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-black text-slate-900">₹${t.mrp_charged}</p>
                            <p class="text-[9px] font-bold text-green-500 uppercase">+₹${t.net_profit?.toFixed(1)} Prof.</p>
                        </div>
                    </div>
                `).join('');
            }
        }

        function updateCalculator() {
            const searchVal = document.getElementById('p-test-search').value;
            const received = Number(document.getElementById('p-received').value);
            const discountPercent = Number(document.getElementById('p-discount').value);
            const preview = document.getElementById('calc-preview');

            const test = testsData.find(t => t.name === searchVal);

            if (test) {
                preview.classList.remove('hidden');
                const mrp = test.mrp;
                const finalPrice = mrp - (mrp * (discountPercent / 100));
                
                // MISHRA RULE: Lab Share @ 40%, Profit @ 60%
                const labShare = mrp * 0.40;
                const rawProfit = finalPrice - labShare;
                const tds = rawProfit > 0 ? rawProfit * 0.10 : 0;
                const netProfit = rawProfit - tds;

                document.getElementById('calc-profit').innerText = "₹" + netProfit.toFixed(2);
                document.getElementById('calc-tds').innerText = "₹" + tds.toFixed(2);
            } else {
                preview.classList.add('hidden');
            }
        }

        function switchView(view) {
            const ownerView = document.getElementById('owner-view');
            const staffView = document.getElementById('staff-view');
            const tabOwner = document.getElementById('tab-owner');
            const tabStaff = document.getElementById('tab-staff');

            if (view === 'staff') {
                ownerView.classList.add('hidden');
                staffView.classList.remove('hidden');
                tabStaff.classList.add('active-tab');
                tabOwner.classList.remove('active-tab');
            } else {
                ownerView.classList.remove('hidden');
                staffView.classList.add('hidden');
                tabOwner.classList.add('active-tab');
                tabStaff.classList.remove('active-tab');
                refreshDashboard();
            }
        }

        async function saveTransaction() {
            const btn = document.getElementById('save-btn');
            const name = document.getElementById('p-name').value;
            const searchVal = document.getElementById('p-test-search').value;
            const received = Number(document.getElementById('p-received').value);
            const discountPercent = Number(document.getElementById('p-discount').value);

            const test = testsData.find(t => t.name === searchVal);
            if (!name || !test) return alert("Please enter name and select a valid test from the list!");

            btn.disabled = true;
            btn.innerText = "Syncing...";

            const mrp = test.mrp;
            const finalPrice = mrp - (mrp * (discountPercent / 100));
            const labShare = mrp * 0.40;
            const rawProfit = finalPrice - labShare;
            const tds = rawProfit > 0 ? rawProfit * 0.10 : 0;
            const netProfit = rawProfit - tds;
            const due = finalPrice - received;

            const { error } = await supabase.from('transactions').insert([{
                patient_name: name,
                test_id: test.id,
                mrp_charged: mrp,
                received_amt: received,
                net_profit: netProfit,
                tds_amount: tds,
                due_amount: due > 0 ? due : 0
            }]);

            if (error) {
                alert("Cloud Error: " + error.message);
                btn.disabled = false;
                btn.innerText = "Try Again";
            } else {
                alert(`✅ Recorded!\nPatient: ${name}\nNet Profit: ₹${netProfit.toFixed(2)}`);
                document.getElementById('p-name').value = "";
                document.getElementById('p-test-search').value = "";
                document.getElementById('p-received').value = "";
                btn.disabled = false;
                btn.innerText = "Save to Nidan Cloud";
                switchView('owner');
            }
        }

        init();
    </script>
</body>
</html>
