<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nidan Kendra | Enterprise Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="app" class="max-w-md mx-auto relative pb-20">
        <!-- HEADER -->
        <header class="bg-[#0f172a] p-8 rounded-b-[3rem] shadow-2xl border-b-4 border-yellow-400">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-extrabold text-yellow-400 tracking-tighter italic">NIDAN KENDRA</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Tamkuhi Raj • Enterprise Hub</p>
                </div>
                <button id="nav-btn" onclick="toggleView()" class="h-10 w-10 bg-yellow-400 rounded-2xl flex items-center justify-center shadow-lg font-black text-slate-900">➕</button>
            </div>
        </header>

        <main class="p-6">
            <!-- VIEW 1: OWNER DASHBOARD -->
            <div id="owner-view" class="space-y-6">
                <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-2xl text-center">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Total Net Profit (10% TDS)</p>
                    <h2 id="total-profit" class="text-5xl font-black text-green-400 tracking-tighter italic">₹0.00</h2>
                    <p class="text-[10px] text-slate-500 mt-4 font-bold uppercase">Database: <span class="text-green-500">Connected ✅</span></p>
                </div>
                
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest px-2">Live Lab Performance</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Pathkind</p>
                        <p id="pk-rev" class="text-lg font-black text-slate-700">₹0</p>
                    </div>
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Dues</p>
                        <p id="total-dues" class="text-lg font-black text-red-500">₹0</p>
                    </div>
                </div>
            </div>

            <!-- VIEW 2: STAFF ENTRY -->
            <div id="staff-view" class="hidden space-y-4">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-200">
                    <h3 class="text-xl font-black text-slate-800 mb-6 tracking-tight">Register Patient</h3>
                    <div class="space-y-4">
                        <input id="p-name" type="text" placeholder="Patient Name" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                        <select id="p-test" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                            <option value="">Loading Tests...</option>
                        </select>
                        <input id="p-received" type="number" placeholder="Cash Received" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                        <button onclick="saveToCloud()" id="save-btn" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-xl">Save & Sync</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // REPLACE THESE WITH YOUR KEYS FROM THE SUPABASE TAB
        const SB_URL = "https://ijndfxvzltvpklvtiytw.supabase.co"; 
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqbmRmeHZ6bHR2cGtsdnRpeXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5OTUzMDksImV4cCI6MjA5NjU3MTMwOX0.rP6TSytlYGJ-jYQUDMyzolBGiBHN3GYzfcn2Nn42-hY

"; 

        const supabase = supabase.createClient(SB_URL, SB_KEY);
        let currentView = 'owner';

        async function init() {
            // Load Prices
            const { data: tests } = await supabase.from('test_catalog').select('*');
            const select = document.getElementById('p-test');
            select.innerHTML = tests.map(t => `<option value="${t.id}" data-mrp="${t.mrp}">${t.name} (₹${t.mrp})</option>`).join('');
            
            // Load Totals
            const { data: trans } = await supabase.from('transactions').select('*');
            const total = trans.reduce((acc, curr) => acc + Number(curr.net_profit), 0);
            const dues = trans.reduce((acc, curr) => acc + Number(curr.due_amount), 0);
            document.getElementById('total-profit').innerText = "₹" + total.toLocaleString();
            document.getElementById('total-dues').innerText = "₹" + dues.toLocaleString();
        }

        function toggleView() {
            currentView = currentView === 'owner' ? 'staff' : 'owner';
            document.getElementById('owner-view').classList.toggle('hidden');
            document.getElementById('staff-view').classList.toggle('hidden');
            document.getElementById('nav-btn').innerText = currentView === 'owner' ? '➕' : '📊';
        }

        async function saveToCloud() {
            const name = document.getElementById('p-name').value;
            const testId = document.getElementById('p-test').value;
            const received = document.getElementById('p-received').value;
            const mrp = document.getElementById('p-test').options[document.getElementById('p-test').selectedIndex].dataset.mrp;

            const labCost = mrp * 0.40;
            const profit = mrp - labCost;
            const tds = profit * 0.10;
            const netProfit = profit - tds;

            const { error } = await supabase.from('transactions').insert([{
                patient_name: name,
                test_id: testId,
                mrp_charged: mrp,
                received_amt: received,
                net_profit: netProfit,
                tds_amount: tds,
                due_amount: mrp - received
            }]);

            if(!error) { alert("Synced!"); location.reload(); }
        }

        init();
    </script>
</body>
</html>
